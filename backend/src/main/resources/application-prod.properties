# ============================================================
# Perfil de Produção — EstoQ
# ============================================================
# Ative com: --spring.profiles.active=prod
#
# Este arquivo assume que TODAS as variáveis de ambiente
# obrigatórias já estão configuradas no host (Render, etc.).
# Sobrescreve defaults inseguros do application.properties base.
# ============================================================

# --- Segurança de sessão ---
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# --- Schema / banco ---
# O schema é gerenciado pelo Flyway; o Hibernate apenas VALIDA contra as entidades.
# Alterações de schema em produção devem passar por migrações.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Seed desligado ---
estoq.seed.enabled=false

# --- Swagger / API docs desligados ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Backup ---
# A imagem Docker instala postgresql-client para fornecer pg_dump.
# O diretório /tmp é efêmero; baixe os dumps que precisarem ser preservados.
estoq.backup.diretorio=/tmp/estoq-backups

# --- CORS ---
# Preencha com o domínio do Vercel (ex: https://estoq-ph-feit0sa.vercel.app)
# Se usar Vercel rewrites, CORS não é necessário (mesmo domínio).
estoq.cors.origins=
