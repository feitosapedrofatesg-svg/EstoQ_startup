# ============================================================
# Perfil de Produção — EstoQ
# ============================================================
# Ative com: --spring.profiles.active=prod
#
# Este arquivo assume que TODAS as variáveis de ambiente
# obrigatórias já estão configuradas no host (Render, etc.).
# Sobrescreve defaults inseguros do application.properties base.
# ============================================================

# --- Segurança de sessão ---
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# --- Schema / banco ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Seed desligado ---
estoq.seed.enabled=false

# --- Swagger / API docs desligados ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Backup ---
# Em PaaS (Render free) não há binário pg_dump.
# Deixe ESTOQ_BACKUP_DIR como /tmp (efêmero) ou desabilite
# a rota POST /api/backups no código antes de produção real.
estoq.backup.diretorio=/tmp/estoq-backups

# --- CORS ---
# Preencha com o domínio do Vercel (ex: https://estoq.vercel.app)
# Se usar Vercel rewrites, CORS não é necessário (mesmo domínio).
estoq.cors.origins=
