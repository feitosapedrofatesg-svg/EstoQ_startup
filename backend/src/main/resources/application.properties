spring.application.name=estoq-startup
estoq.ambiente=${ESTOQ_AMBIENTE:local}
server.port=${PORT:8083}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/estoq_startup?currentSchema=estoq_v2}
spring.datasource.username=${DATABASE_USER:estoq}
spring.datasource.password=${DATABASE_PASSWORD:estoq}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.data.web.pageable.max-page-size=100
server.servlet.session.timeout=24h
server.servlet.session.cookie.name=ESTOQSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_SECURE:true}
server.servlet.session.cookie.same-site=${SESSION_SAMESITE:lax}
estoq.cors.origins=${CORS_ORIGINS:}
estoq.seed.enabled=${SEED_ENABLED:false}
estoq.login.max-tentativas=${LOGIN_MAX_TENTATIVAS:5}
estoq.login.janela-minutos=${LOGIN_JANELA_MINUTOS:15}
# Isolamento por restaurante (tenant) — coluna usada pelo @TenantId em todas as tabelas de negócio.
spring.jpa.properties.hibernate.mapping.default_tenant_id_column_name=restaurante_id
# Migrações versionadas (Flyway): desligadas apenas nos testes, que usam create-drop do Hibernate.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
# Backup — sem ESTOQ_BACKUP_* / DATABASE_URL é derivada de spring.datasource.*
estoq.backup.diretorio=${ESTOQ_BACKUP_DIR:../dados/backups}
estoq.backup.host=${ESTOQ_BACKUP_HOST:}
estoq.backup.porta=${ESTOQ_BACKUP_PORTA:0}
estoq.backup.database=${ESTOQ_BACKUP_DB:}
estoq.backup.schema=${ESTOQ_BACKUP_SCHEMA:}
estoq.backup.usuario=${ESTOQ_BACKUP_USER:}
estoq.backup.senha=${ESTOQ_BACKUP_PASS:}
estoq.backup.manter=${ESTOQ_BACKUP_MANTER:7}

# Limite de upload das notas, incluindo o cabeçalho multipart.
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB

# Atualizações em lote evitam uma viagem ao banco por item do balanço.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_updates=true

# Ativar somente depois de autorizar e testar o remetente Gmail.
estoq.email.confirmacao.enabled=${EMAIL_CONFIRMACAO_ENABLED:false}
estoq.email.remetente=${EMAIL_FROM:estoq.sistema@gmail.com}
estoq.email.url-publica=${APP_PUBLIC_URL:}
estoq.email.google.client-id=${GOOGLE_CLIENT_ID:}
estoq.email.google.client-secret=${GOOGLE_CLIENT_SECRET:}
estoq.email.google.refresh-token=${GOOGLE_REFRESH_TOKEN:}

# Cliente OAuth Web, separado do cliente Desktop que autoriza o Gmail.
estoq.login.google.enabled=${GOOGLE_LOGIN_ENABLED:false}
estoq.login.google.client-id=${GOOGLE_LOGIN_CLIENT_ID:}
estoq.login.google.client-secret=${GOOGLE_LOGIN_CLIENT_SECRET:}
estoq.login.google.url-publica=${APP_PUBLIC_URL:}
