spring.application.name=estoq-startup
server.port=${PORT:8083}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/estoq_startup?currentSchema=estoq_v2}
spring.datasource.username=${DATABASE_USER:estoq}
spring.datasource.password=${DATABASE_PASSWORD:estoq}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.data.web.pageable.max-page-size=100
server.servlet.session.timeout=24h
server.servlet.session.cookie.name=ESTOQSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_SECURE:true}
server.servlet.session.cookie.same-site=${SESSION_SAMESITE:lax}
estoq.cors.origins=${CORS_ORIGINS:}
estoq.seed.enabled=${SEED_ENABLED:false}
estoq.login.max-tentativas=${LOGIN_MAX_TENTATIVAS:5}
estoq.login.janela-minutos=${LOGIN_JANELA_MINUTOS:15}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
# Backup
estoq.backup.diretorio=${ESTOQ_BACKUP_DIR:../dados/backups}
estoq.backup.host=${ESTOQ_BACKUP_HOST:localhost}
estoq.backup.porta=${ESTOQ_BACKUP_PORTA:5434}
estoq.backup.database=${ESTOQ_BACKUP_DB:estoq_startup}
estoq.backup.schema=${ESTOQ_BACKUP_SCHEMA:estoq_v2}
estoq.backup.usuario=${ESTOQ_BACKUP_USER:estoq}
estoq.backup.senha=${ESTOQ_BACKUP_PASS:estoq}
estoq.backup.manter=${ESTOQ_BACKUP_MANTER:7}
