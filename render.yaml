# Blueprint espelho do serviço em produção.
# Criado manualmente em 18/10/2026 (migração Oregon -> Virgínia, para ficar na
# mesma região do banco Supabase us-east-1). Detalhes em
# documentacao/MIGRACAO_REGIAO_VIRGINIA.md.
services:
  - type: web
    name: estoq-backend-va
    runtime: docker
    repo: https://github.com/feitosapedrofatesg-svg/EstoQ_startup
    branch: main
    region: virginia
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: PORT
        value: 8080
      - key: SESSION_SECURE
        value: "true"
      - key: SESSION_SAMESITE
        value: lax
      - key: DDL_AUTO
        value: validate
      - key: FLYWAY_ENABLED
        value: "true"
      - key: SEED_ENABLED
        value: "false"
      - key: API_DOCS_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: ESTOQ_BACKUP_DIR
        value: /tmp/estoq-backups
      - key: ESTOQ_BACKUP_SCHEMA
        value: estoq_v2
    autoDeploy: true
    healthCheckPath: /api/auth/csrf
